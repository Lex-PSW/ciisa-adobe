ity=".5"/><stop offset="1" stop-color="#bcf200" stop-opacity="0"/></linearGradient><linearGradient id="sxj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="320" height="160" fill="url(#bgj)"/><rect width="320" height="160" fill="url(#glj)"/>
