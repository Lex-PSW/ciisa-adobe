-opacity=".5"/><stop offset="1" stop-color="#bcf200" stop-opacity="0"/></linearGradient><linearGradient id="sxi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="shsw"><path d="M160 20 L220 43 V88 C220 118 193 138 160 148 C127 138 100 118 100 88 V43Z"/></clipPath></defs><rect width="320" height="160" fill="url(#bgi)"/><rect width="320" height="160" fill="url(#gli)"/>
